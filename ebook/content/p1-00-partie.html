<div class="p-lab">PARTIE I</div>
<div class="p-num">I</div>
<h1>Comprendre</h1>
<div class="p-rule"></div>
<p class="p-sub">Ce qui se passe vraiment dans ton corps — et pourquoi aucun des mots que tu emploies pour le décrire n’est faux.</p>
<p class="p-quote">« On ne guérit pas de la peur en se répétant que tout va bien. On en guérit en comprenant exactement ce qui se passe. »</p>
