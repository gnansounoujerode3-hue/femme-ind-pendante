<h1>Agir</h1>
<div class="p-rule"></div>
<p class="p-sub">Le programme des 21 nuits : un geste par soir, dix minutes, et un journal pour mesurer ce qui change.</p>
<p class="p-quote">« On ne change pas une nuit en décidant de changer. On la change en changeant vingt et une nuits de suite, un tout petit peu. »</p>
